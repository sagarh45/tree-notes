theory:`<div class="section"><h3>1.1 Definition of a Tree (write this in the exam)</h3><p>A <b>Tree</b> is a <b>non-linear, hierarchical</b> data structure made of <b>nodes</b> connected by <b>edges</b>, such that there is <b>exactly one path</b> between any two nodes. It starts from a special node called the <b>root</b> and has <b>no cycles</b>.</p><div class="law">n nodes ⇒ exactly <b>n − 1</b> edges. Every node except the root brings exactly one edge (the link to its parent).</div><p>Think of a family tree or a company chart: one person at the top, children below, nobody has two bosses, nobody is their own grand-boss. In CS we draw the tree <b>upside down</b>: root at the top, leaves at the bottom.</p><table class="table"><tr><th>Picture</th><th>Tree?</th><th>Reason</th></tr><tr><td>A→B, A→C, B→D</td><td><b>Yes</b></td><td>One root, one parent each, no loop, 4 nodes 3 edges</td></tr><tr><td>A→B, A→C, B→D, C→D</td><td><b>No</b></td><td>D has two parents — this is a graph</td></tr><tr><td>A→B→C→A</td><td><b>No</b></td><td>Cycle. Trees never loop</td></tr><tr><td>A→B and a separate C→D</td><td><b>No</b> (it is a <b>forest</b>)</td><td>Two roots</td></tr></table></div>
<div class="section"><h3>1.2 Why trees?</h3><p>Two reasons: (1) the data itself is a hierarchy (folders, HTML, organisation). (2) Speed — a balanced tree of 1,000,000 keys needs about 20 comparisons (log₂ n), not 1,000,000.</p><div class="grid2"><div class="card"><b>File system</b><br>C:\\ → Notes → DS → Trees</div><div class="card"><b>HTML / XML DOM</b><br>&lt;html&gt; is the root, tags nest</div><div class="card"><b>Expression trees</b><br>(a + b) * c in a compiler</div><div class="card"><b>Databases</b><br>indexes are B-Trees / B+ Trees</div></div></div>
<div class="section"><h3>1.3 Terminology (same sample tree for every word)</h3><p>Sample: A at the top; B and C under A; D and E under B; F under C; G under E.</p><table class="table"><tr><th>Term</th><th>Meaning</th><th>On the sample</th></tr><tr><td>Node</td><td>One box of data plus links to children</td><td>A,B,C,D,E,F,G — 7 nodes</td></tr><tr><td>Root</td><td>Only node with no parent</td><td>A</td></tr><tr><td>Edge</td><td>Link between parent and child</td><td>A–B, A–C, … (6 edges)</td></tr><tr><td>Parent / Child</td><td>Directly above / directly below</td><td>Parent of D is B, not A</td></tr><tr><td>Siblings</td><td>Same parent</td><td>B,C · D,E. E and F are NOT siblings</td></tr><tr><td>Leaf / External</td><td>No children (degree 0)</td><td>D, G, F</td></tr><tr><td>Internal</td><td>At least one child</td><td>A, B, C, E</td></tr><tr><td>Degree of a node</td><td>Number of children</td><td>A=2, C=1, D=0</td></tr><tr><td>Degree of the tree</td><td>Maximum node degree</td><td>2</td></tr><tr><td>Level</td><td>Edges from the root (root = 0)</td><td>A=0, B=C=1, D=E=F=2, G=3</td></tr><tr><td>Depth</td><td>Same number as level when root = 0; measured from the root down</td><td>depth(G)=3 via A→B→E→G</td></tr><tr><td>Height of a node</td><td>Longest downward path in edges (leaf = 0)</td><td>height(B)=2, height(A)=3</td></tr><tr><td>Height of tree</td><td>Height of the root = max level</td><td>3</td></tr><tr><td>Path</td><td>Sequence of edges; length = edges</td><td>A→B→E→G length 3</td></tr><tr><td>Ancestor / Descendant</td><td>Up to root / everything below</td><td>Ancestors of G: E,B,A</td></tr><tr><td>Subtree</td><td>A node plus all its descendants</td><td>Subtree of B = {B,D,E,G}</td></tr><tr><td>Forest</td><td>A set of disjoint trees</td><td>Delete A → forest {B…, C…}</td></tr><tr><td>Weight</td><td>Number of leaves</td><td>3</td></tr></table><div class="note"><b>Convention:</b> these notes count height in <b>edges</b> (leaf = 0). If your teacher counts nodes (leaf = 1), every height becomes +1 — write which one you use.</div></div>
<div class="section"><h3>1.4 Binary Tree — definition</h3><p>A <b>binary tree</b> is a finite set of nodes that is either <b>empty</b>, or consists of a <b>root</b> and two disjoint binary trees called the <b>left subtree</b> and the <b>right subtree</b>. Every node has <b>0, 1 or 2</b> children, and the two sides have names.</p><div class="law">“Only a left child” and “only a right child” are <b>different</b> binary trees, even if the values are the same.</div><div class="fn"><b>Function — node of a binary tree</b><pre class="code">struct Node {
    int data;
    struct Node *left;
    struct Node *right;
};</pre></div></div>
<div class="section"><h3>1.5 Types of binary tree</h3><table class="table"><tr><th>Type</th><th>Rule</th></tr><tr><td>Full / Strictly binary</td><td>Every node has 0 or 2 children (never one)</td></tr><tr><td>Complete / Almost complete</td><td>All levels full except possibly the last, which fills <b>left to right</b></td></tr><tr><td>Perfect</td><td>Every internal node has 2 children and all leaves are on one level</td></tr><tr><td>Skewed (left / right)</td><td>Every node has only one child — becomes a stick</td></tr><tr><td>Extended</td><td>Replace every NULL by an external square node; used in Huffman / path-length proofs</td></tr></table></div>
<div class="section"><h3>1.6 Formulas (every numerical they can ask)</h3><table class="table"><tr><th>Fact</th><th>Formula</th></tr><tr><td>Edges in any tree</td><td>n − 1</td></tr><tr><td>NULL pointers in a linked binary tree</td><td>n + 1</td></tr><tr><td>Max nodes at level i (root = 0)</td><td>2<sup>i</sup></td></tr><tr><td>Max nodes of height h</td><td>2<sup>h+1</sup> − 1 (perfect)</td></tr><tr><td>Min nodes of height h</td><td>h + 1 (skewed)</td></tr><tr><td>Full binary tree</td><td>Leaves L = Internal I + 1</td></tr><tr><td>Minimum height for n nodes</td><td>⌈log₂(n+1)⌉ − 1</td></tr><tr><td>Leaves vs 2-child nodes (any binary tree)</td><td>n₀ = n₂ + 1</td></tr><tr><td>Distinct binary trees on n nodes</td><td>Catalan C<sub>n</sub> = (2n)! / ((n+1)! n!)</td></tr></table><div class="exam"><b>Exam 3-mark:</b> A full binary tree has 20 internal nodes. Leaves = 21. Total n = 41. Min height (edges) = ⌈log₂ 42⌉ − 1 = 5.</div></div>`,

<div class="section"><h3>Class-notes tree — every number on one picture</h3>

<div class="section"><h3>17 terminology cards — one drawing each</h3>
<p>Same sample. Gold labels in the ASCII picture are the ones that belong to that word.</p>

C is the interesting one: only a right child, degree still 1.</div>
<div class="exam">Exam: degree of a node = number of children.</div></div>

<div class="term"><h4>10. Degree of the tree</h4><p>The maximum node-degree in the whole tree.</p>
<div class="diagram">Max of {2,2,1,0,1,0,0} = 2
so this is a tree of degree 2 (a binary tree).</div>
<div class="exam">Exam: degree of the tree = max node-degree. Not the same as degree of a node.</div></div>

<div class="term"><h4>11. Level</h4><p>How far from the root, counting edges. Root = level 0 in these notes.</p>
<div class="diagram">Level 0: A
Level 1: B C
Level 2: D E F
Level 3: G
F is on the same floor as D and E even though C has no left child.</div>
<div class="exam">Exam: level(root)=0; child level = parent level + 1.</div></div>

<div class="term"><h4>12. Depth of a node</h4><p>Number of edges from the root down to that node. Same number as level when root = 0.</p>
<div class="diagram">A → B → E → G
depth(A)=0  depth(B)=1  depth(E)=2  depth(G)=3</div>
<div class="exam">Exam: depth is measured from the root downward.</div></div>

<div class="term"><h4>13. Height of a node</h4><p>Longest path downward from that node to a leaf. Count edges. Leaf height = 0. height(NULL) = −1.</p>
<div class="diagram">h(D)=h(F)=h(G)=0
h(E)=1   h(C)=1   h(B)=2   h(A)=3
height(n) = 1 + max(height(left), height(right))</div>
<div class="exam">Exam: write the recursive formula. Stay consistent with leaf = 0.</div></div>

<div class="term"><h4>14. Height of the tree</h4><p>Height of the root. How tall the whole tree is.</p>
<div class="diagram">Longest root-to-leaf: A → B → E → G  (3 edges)
Height of tree = height(A) = 3 = max level.</div>
<div class="exam">Exam: height of the tree = height of the root.</div></div>

<div class="term"><h4>15. Path</h4><p>The sequence of nodes you walk from one node to another. A tree has no extra routes.</p>
<div class="diagram">Only path A to G:  A → B → E → G
You cannot go A → C → … to reach G.
Length of a path = number of edges = 3.</div>
<div class="exam">Exam: in a tree there is exactly one simple path between any two nodes.</div></div>

<div class="term"><h4>16. Ancestor and descendant</h4><p>If you can walk down from X to Y, X is an ancestor of Y and Y is a descendant of X.</p>
<div class="diagram">For G: ancestors = E, B, A
Descendants of B = D, E, G
F is NOT a descendant of B — it hangs under C.</div>
<div class="exam">Exam: parent is the immediate ancestor; child is the immediate descendant.</div></div>

<div class="term"><h4>17. Forest</h4><p>A set of disjoint trees — many trees, not joined by one common root.</p>
<div class="diagram">Delete root A. What remains:

  Tree 1              Tree 2
    B                   C
   / \                   \
  D   E                   F
       \
        G

Together these two trees are a forest.</div>
<div class="exam">Exam: a forest is a collection of trees.</div></div>

<div class="term"><h4>18. Weight</h4><p>Number of leaf (external) nodes.</p>
<div class="diagram">Leaves = D, G, F  →  weight = 3</div>
<div class="exam">Exam: weight of a tree = number of leaves.</div></div>
</div></div>

program:`<div class="section"><h3>Syntax — node + createNode()</h3><div class="fn"><b>Algorithm createNode(value)</b><ol class="algo"><li>Allocate memory of size struct Node.</li><li>Store value in data.</li><li>Set left = NULL and right = NULL.</li><li>Return the pointer.</li></ol></div></div>
<div class="section"><h3>Complete C Program: build a tree from user keys (BST insert) and print inorder</h3><pre class="code">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

struct Node {
    int data;
    struct Node *left;
    struct Node *right;
};

struct Node *createNode(int value) {
    struct Node *n = (struct Node *)malloc(sizeof(struct Node));
    n-&gt;data = value;
    n-&gt;left = n-&gt;right = NULL;
    return n;
}

struct Node *insert(struct Node *root, int value) {
    if (root == NULL) return createNode(value);
    if (value &lt; root-&gt;data) root-&gt;left = insert(root-&gt;left, value);
    else if (value &gt; root-&gt;data) root-&gt;right = insert(root-&gt;right, value);
    return root;
}

void inorder(struct Node *root) {
    if (root == NULL) return;
    inorder(root-&gt;left);
    printf("%d ", root-&gt;data);
    inorder(root-&gt;right);
}

int main(void) {
    struct Node *root = NULL;
    int n, i, x;
    printf("How many keys? ");
    scanf("%d", &amp;n);
    for (i = 0; i &lt; n; i++) {
        printf("Key %d: ", i + 1);
        scanf("%d", &amp;x);
        root = insert(root, x);
    }
    printf("Inorder: ");
    inorder(root);
    printf("\\n");
    return 0;
}</pre>
<div class="io">Input:
How many keys? 7
Key 1: 50
... 30 70 20 40 60 80

Output:
Inorder: 20 30 40 50 60 70 80</div>
<div class="note">Inorder is sorted ⇒ the tree is a BST. That is the 2-second check after every drawing.</div></div>`},

'traversal':{
theory:`<div class="section"><h3>2.0 What is traversal?</h3><p><b>Traversal</b> is visiting each node <b>exactly once</b> in a fixed order. The three depth-first traversals differ only in <b>when N (the node) is visited</b> relative to L and R. Left always comes before Right.</p><div class="law">Pre-order = <b>N L R</b> · In-order = <b>L N R</b> · Post-order = <b>L R N</b> · Level-order = floor by floor, left to right (queue).</div><p>Quick checks: pre-order always <b>starts</b> with the root; post-order always <b>ends</b> with the root; in-order of a BST is <b>sorted</b>.</p></div>
<div class="section"><h3>2.1 Pre-order (NLR) — root first</h3><p><b>Use:</b> copy a tree (create parent before children), prefix expression.</p><div class="fn"><b>Algorithm Preorder(tree)</b><ol class="algo"><li>If tree is NULL, return.</li><li>Visit / print tree→data.</li><li>Preorder(tree→left).</li><li>Preorder(tree→right).</li></ol></div>
<pre class="code">void preorder(struct Node *r) {
    if (r == NULL) return;
    printf("%d ", r-&gt;data);   /* N */
    preorder(r-&gt;left);        /* L */
    preorder(r-&gt;right);       /* R */
}</pre></div>
<div class="section"><h3>2.2 In-order (LNR) — root in the middle</h3><p><b>Use:</b> print a BST in sorted order. Trick: hang the tree, drop every node straight down, read left to right.</p><div class="fn"><b>Algorithm Inorder(tree)</b><ol class="algo"><li>If tree is NULL, return.</li><li>Inorder(tree→left).</li><li>Visit tree→data.</li><li>Inorder(tree→right).</li></ol></div>
<pre class="code">void inorder(struct Node *r) {
    if (r == NULL) return;
    inorder(r-&gt;left);
    printf("%d ", r-&gt;data);
    inorder(r-&gt;right);
}</pre></div>
<div class="section"><h3>2.3 Post-order (LRN) — root last</h3><p><b>Use:</b> delete / free a tree (children before parent), postfix evaluation of an expression tree.</p><div class="fn"><b>Algorithm Postorder(tree)</b><ol class="algo"><li>If tree is NULL, return.</li><li>Postorder(left); Postorder(right); Visit root.</li></ol></div>
<pre class="code">void postorder(struct Node *r) {
    if (r == NULL) return;
    postorder(r-&gt;left);
    postorder(r-&gt;right);
    printf("%d ", r-&gt;data);
}</pre></div>
<div class="section"><h3>2.4 Level-order (BFS) — a queue</h3><div class="fn"><b>Algorithm LevelOrder(root)</b><ol class="algo"><li>If root is NULL, stop.</li><li>Enqueue root.</li><li>While queue not empty: dequeue p, visit p, enqueue p→left if any, enqueue p→right if any.</li></ol></div></div>
<div class="section"><h3>2.5 Non-recursive in-order (explicit stack)</h3><p>Recursion secretly uses the system stack. Written by hand: go left, go left… cannot? pop and print, then try right.</p><div class="fn"><b>Algorithm inorderIterative(root)</b><ol class="algo"><li>cur = root, stack empty.</li><li>While cur ≠ NULL or stack not empty:</li><li>&nbsp;&nbsp;a. While cur ≠ NULL: push cur, cur = cur→left.</li><li>&nbsp;&nbsp;b. cur = pop(); visit cur.</li><li>&nbsp;&nbsp;c. cur = cur→right.</li></ol></div></div>
<div class="section"><h3>2.6 Rebuild a tree from two traversals</h3><div class="law">In-order + Pre-order uniquely rebuild a binary tree. In-order + Post-order also. Pre + Post do <b>not</b>, unless the tree is full.</div><div class="fn"><b>Algorithm build(pre, in)</b><ol class="algo"><li>Root = first of pre-order (last of post-order).</li><li>Find the root in in-order: left slice = left subtree, right slice = right subtree.</li><li>Recurse on each slice with the matching pre-order piece.</li></ol></div><div class="exam"><b>Classic:</b> Pre = A B D E C F G, In = D B E A F C G → tree A(B(D,E), C(F,G)).</div></div>
<div class="section"><h3>Complexity</h3><table class="table"><tr><th>Traversal</th><th>Time</th><th>Extra space</th></tr><tr><td>Pre / In / Post recursive</td><td>Θ(n)</td><td>O(h) call stack</td></tr><tr><td>Level-order</td><td>Θ(n)</td><td>O(w) queue, w = widest level</td></tr><tr><td>Iterative in-order</td><td>Θ(n)</td><td>O(h) explicit stack</td></tr></table></div>`,
visualization:`<div class="section"><h3>One tree, four answers (notes example)</h3><div class="diagram">              78

<table class="table"><tr><th>Traversal</th><th>Rule</th><th>Output</th></tr><tr><td>Pre-order</td><td>N L R</td><td><b>78 26 23 43 94 97</b></td></tr><tr><td>In-order</td><td>L N R</td><td><b>23 26 43 78 94 97</b> (sorted ⇒ BST)</td></tr><tr><td>Post-order</td><td>L R N</td><td><b>23 43 26 97 94 78</b></td></tr><tr><td>Level-order</td><td>top→bottom, L→R</td><td><b>78 26 94 23 43 97</b></td></tr></table></div>

<div class="trace">Pre = A B D E C F G · In = D B E A F C G · Post = D E B F G C A · Level = A B C D E F G</div></div>
<div class="section"><h3>Level-order queue dry run on 4(2(1,3),6(5,7))</h3><table class="table"><tr><th>Dequeue</th><th>Print</th><th>Enqueue</th><th>Queue</th></tr><tr><td>—</td><td>—</td><td>4</td><td>4</td></tr><tr><td>4</td><td>4</td><td>2, 6</td><td>2 6</td></tr><tr><td>2</td><td>2</td><td>1, 3</td><td>6 1 3</td></tr><tr><td>6</td><td>6</td><td>5, 7</td><td>1 3 5 7</td></tr><tr><td>1 3 5 7</td><td>1 3 5 7</td><td>—</td><td>empty</td></tr></table></div>
<div class="section"><h3>Rebuild: Pre = A B D E C F G, In = D B E A F C G</h3><ol class="algo"><li>Pre first = <b>A</b> → root. In splits left {D B E}, right {F C G}.</li><li>Next pre = <b>B</b> → root of left. In D B E → left D, right E.</li><li>Next unused after left = <b>C</b> → root of right. In F C G → left F, right G.</li></ol><div class="diagram">        A
       / \\
      B   C
     / \\ / \\
    D  E F  G</div><div class="exam">Verification: write pre-order of your drawing. It must match the given pre-order.</div></div>`,
program:`<div class="section"><h3>Complete C Program: User Input + All Traversals</h3><pre class="code">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

struct Node {
    int data;
    struct Node *left, *right;
};

struct Node *newNode(int x) {
    struct Node *n = (struct Node *)malloc(sizeof(struct Node));
    n-&gt;data = x; n-&gt;left = n-&gt;right = NULL;
    return n;
}

struct Node *insertLevel(struct Node *root, int x) {
    struct Node *q[100]; int f = 0, r = 0;
    if (root == NULL) return newNode(x);
    q[r++] = root;
    while (f &lt; r) {
        struct Node *p = q[f++];
        if (p-&gt;left == NULL) { p-&gt;left = newNode(x); return root; }
        q[r++] = p-&gt;left;
        if (p-&gt;right == NULL) { p-&gt;right = newNode(x); return root; }
        q[r++] = p-&gt;right;
    }
    return root;
}

void preorder(struct Node *r) {
    if (!r) return;
    printf("%d ", r-&gt;data);
    preorder(r-&gt;left); preorder(r-&gt;right);
}
void inorder(struct Node *r) {
    if (!r) return;
    inorder(r-&gt;left); printf("%d ", r-&gt;data); inorder(r-&gt;right);
}
void postorder(struct Node *r) {
    if (!r) return;
    postorder(r-&gt;left); postorder(r-&gt;right); printf("%d ", r-&gt;data);
}
void levelorder(struct Node *root) {
    struct Node *q[100]; int f = 0, r = 0;
    if (!root) return;
    q[r++] = root;
    while (f &lt; r) {
        struct Node *p = q[f++];
        printf("%d ", p-&gt;data);
        if (p-&gt;left) q[r++] = p-&gt;left;
        if (p-&gt;right) q[r++] = p-&gt;right;
    }
}

int main(void) {
    struct Node *root = NULL;
    int n, x, i;
    printf("How many nodes? ");
    scanf("%d", &amp;n);
    for (i = 0; i &lt; n; i++) { scanf("%d", &amp;x); root = insertLevel(root, x); }
    printf("Preorder: "); preorder(root);
    printf("\\nInorder: "); inorder(root);
    printf("\\nPostorder: "); postorder(root);
    printf("\\nLevel order: "); levelorder(root);
    return 0;
}</pre></div>`},

'linked':{
theory:`<div class="section"><h3>3.1 Linked representation</h3><p>Each node is a dynamically allocated record with three fields:</p><div class="law">[ LEFT pointer | DATA | RIGHT pointer ]</div><p><b>left</b> = address of left child, <b>data</b> = the value, <b>right</b> = address of right child. A missing child is <b>NULL</b>.</p><div class="fn"><b>Syntax</b><pre class="code">struct Node {
    int data;
    struct Node *left;
    struct Node *right;
};

struct Node *createNode(int value) {
    struct Node *n = (struct Node *)malloc(sizeof(struct Node));
    n-&gt;data = value;
    n-&gt;left = NULL;
    n-&gt;right = NULL;
    return n;
}</pre></div>
<div class="fn"><b>Algorithm createNode(value)</b><ol class="algo"><li>n = malloc(sizeof(struct Node)).</li><li>If n is NULL, stop (out of memory).</li><li>n→data = value; n→left = n→right = NULL.</li><li>Return n.</li></ol></div></div>
<div class="section"><h3>3.2 How the tree is actually connected</h3><p>The tree exists only as pointers. <code>root</code> is just a pointer to the first node. Connecting a child is one assignment: <code>parent-&gt;left = createNode(20);</code></p><table class="table"><tr><th>Fact</th><th>Why</th></tr><tr><td>2n pointer fields in n nodes</td><td>Each node has left and right</td></tr><tr><td>n − 1 pointers are used</td><td>One edge per node except the root</td></tr><tr><td><b>n + 1</b> pointers are NULL</td><td>2n − (n − 1) = n + 1. Threaded trees recycle these.</td></tr></table></div>
<div class="section"><h3>3.3 Array (sequential) vs linked</h3><p>A complete binary tree can also sit in an array: for 1-based index i, left = 2i, right = 2i+1, parent = ⌊i/2⌋.</p><table class="table"><tr><th></th><th>Linked</th><th>Array</th></tr><tr><td>Space</td><td>Exactly n nodes, plus 2 pointers each</td><td>Wastes slots if the tree is skewed</td></tr><tr><td>Insert anywhere</td><td>Easy (malloc one node)</td><td>May need a huge array</td></tr><tr><td>Find parent</td><td>Need an extra parent pointer, or walk from root</td><td>O(1) by index</td></tr><tr><td>Used by</td><td>BST, AVL, expression trees</td><td>Heaps (the array IS the tree)</td></tr></table><div class="exam"><b>Exam line:</b> Linked is the default for binary trees. Array is used when the tree is complete (heap).</div></div>
<div class="section"><h3>3.4 Empty tree</h3><pre class="code">struct Node *root = NULL;   /* empty binary tree is valid */</pre></div>`,

40</div></div><div class="card"><b>Memory boxes [L | data | R]</b><div class="diagram">      [ * | 10 | * ]

[ ∅ | 40 | ∅ ]</div></div></div>
<div class="trace">4 nodes ⇒ 5 NULL pointers (n+1): 20-right, 30-left, 30-right, 40-left, 40-right.</div></div>
<div class="section"><h3>Array form of a complete tree (1-based)</h3><div class="diagram">        10          index:  1   2   3   4   5
       /  \\         value: 10  20  30  40  50
     20    30
    /  \\
  40    50</div><div class="trace">left(2)=4 → 40, right(2)=5 → 50, parent(5)=2 → 20. No holes, so the array is exact.</div></div>
<div class="section"><h3>Skewed tree wastes the array</h3><div class="diagram">10                  [10, —, 20, —, —, —, 30]
  \\
   20
     \\
      30</div><div class="trace">Height 2 already needs 7 slots and most are empty. That is why BST/AVL use linked nodes, not arrays.</div></div>`,
program:`<div class="section"><h3>Complete C Program: Linked Node Creation</h3><pre class="code">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

struct Node {
    int data;
    struct Node *left;
    struct Node *right;
};

struct Node *createNode(int value) {
    struct Node *n = (struct Node *)malloc(sizeof(struct Node));
    if (n == NULL) exit(1);
    n-&gt;data = value;
    n-&gt;left = NULL;
    n-&gt;right = NULL;
    return n;
}

int main(void) {
    struct Node *root = createNode(10);
    root-&gt;left = createNode(20);
    root-&gt;right = createNode(30);
    printf("%d has children %d and %d\\n", root-&gt;data,
           root-&gt;left-&gt;data, root-&gt;right-&gt;data);
    return 0;
}</pre></div>`},

'binary-ops':{
theory:`<div class="section"><h3>Important Idea</h3><p>A normal Binary Tree has <b>no key-ordering rule</b>. Therefore its operations differ from BST operations.</p></div>
<div class="section"><h3>4.1 Insert</h3><p>Use level-order insertion to place a new node in the first available child position.</p><div class="flow">If root is NULL create root → otherwise BFS using queue → check left → check right → insert at first NULL.</div><p>Time: O(n) in the worst case.</p></div>
<div class="section"><h3>4.2 Delete</h3><p>One common general Binary Tree deletion method replaces the target node with the <b>deepest-rightmost node</b>.</p><div class="flow">Find target → find deepest-rightmost → copy deepest value into target → disconnect/free deepest node.</div><p>Time: O(n).</p></div>
<div class="section"><h3>4.3 Search</h3><p>Because no ordering exists, search may inspect every node.</p><div class="flow">BFS/DFS through nodes until key is found or traversal ends.</div><p>Worst-case time: O(n).</p></div>`,
visualization:`<div class="section"><h3>4.1 Insert Example</h3><p>Insert 50 in level order.</p><div class="diagram">Before:             After:
      10                  10
     /  \\                /  \\
   20    30            20    30
  /                    /  \\
40                    40  50</div><div class="trace">First empty child position is the right child of 20.</div></div>
<div class="section"><h3>4.2 Delete Example</h3><p>Delete 20 from the tree containing 50 as deepest-rightmost node.</p><div class="diagram">Before:             After:
      10                  10
     /  \\                /  \\
   20    30            50    30
  / \\                  /
40  50                40</div><div class="trace">Copy 50 into target 20, then delete the original deepest node 50.</div></div>
<div class="section"><h3>4.3 Search Example</h3><div class="trace">Search 40 using BFS: 10 → 20 → 30 → 40 = FOUND.</div></div>`,
program:`<div class="section"><h3>Complete C Program: Binary Tree Insert, Delete, Search</h3><pre class="code">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

struct Node { int data; struct Node *left,*right; };
struct Node *newNode(int x){
    struct Node *n=(struct Node*)malloc(sizeof(struct Node));
    n-&gt;data=x; n-&gt;left=n-&gt;right=NULL; return n;
}

struct Node *insertBT(struct Node *root,int x){
    struct Node *q[100]; int f=0,r=0;
    if(!root) return newNode(x);
    q[r++]=root;
    while(f&lt;r){
        struct Node *p=q[f++];
        if(!p-&gt;left){ p-&gt;left=newNode(x); return root; }
        q[r++]=p-&gt;left;
        if(!p-&gt;right){ p-&gt;right=newNode(x); return root; }
        q[r++]=p-&gt;right;
    }
    return root;
}

struct Node *searchBT(struct Node *root,int key){
    struct Node *q[100]; int f=0,r=0;
    if(!root) return NULL;
    q[r++]=root;
    while(f&lt;r){
        struct Node *p=q[f++];
        if(p-&gt;data==key) return p;
        if(p-&gt;left) q[r++]=p-&gt;left;
        if(p-&gt;right) q[r++]=p-&gt;right;
    }
    return NULL;
}

struct Node *deleteBT(struct Node *root,int key){
    struct Node *q[100],*target=NULL,*last=NULL,*parent=NULL;
    int f=0,r=0;
    if(!root) return NULL;
    if(!root-&gt;left &amp;&amp; !root-&gt;right){
        if(root-&gt;data==key){ free(root); return NULL; }
        return root;
    }
    q[r++]=root;
    while(f&lt;r){
        struct Node *p=q[f++];
        if(p-&gt;data==key) target=p;
        if(p-&gt;left){ parent=p; q[r++]=p-&gt;left; }
        if(p-&gt;right){ parent=p; q[r++]=p-&gt;right; }
        last=p;
    }
    if(!target) return root;
    target-&gt;data=last-&gt;data;
    if(parent-&gt;right==last) parent-&gt;right=NULL;
    else parent-&gt;left=NULL;
    free(last);
    return root;
}

void level(struct Node *root){
    struct Node *q[100]; int f=0,r=0;
    if(!root) return; q[r++]=root;
    while(f&lt;r){ struct Node *p=q[f++]; printf("%d ",p-&gt;data);
        if(p-&gt;left) q[r++]=p-&gt;left; if(p-&gt;right) q[r++]=p-&gt;right; }
}

int main(void){
    struct Node *root=NULL; int ch,x;
    do{
        printf("\\n1.Insert 2.Delete 3.Search 4.Display 0.Exit: "); scanf("%d",&amp;ch);
        if(ch==1){ scanf("%d",&amp;x); root=insertBT(root,x); }
        else if(ch==2){ scanf("%d",&amp;x); root=deleteBT(root,x); }
        else if(ch==3){ scanf("%d",&amp;x); printf(searchBT(root,x)?"Found\\n":"Not Found\\n"); }
        else if(ch==4){ level(root); printf("\\n"); }
    }while(ch!=0);
    return 0;
}</pre></div>`},

'bst-ops':{
theory:`<div class="section"><h3>5.0 BST definition</h3><div class="law">For <b>every</b> node: whole left subtree &lt; node &lt; whole right subtree. Both subtrees are themselves BSTs. Therefore <b>in-order is sorted</b>.</div><p>The rule is about the <b>whole subtree</b>, not just the direct child. Duplicates: either forbidden, or always sent to one fixed side — say which.</p><div class="exam"><b>NOT a BST:</b> 30(20, 40(25, 50)). Locally 25&lt;40 looks fine, but 25 sits in the RIGHT of 30 while 25&lt;30. In-order 20 30 25 40 50 is not sorted.</div></div>
<div class="section"><h3>5.1 Search</h3><div class="fn"><b>Algorithm search(root, key)</b><ol class="algo"><li>If root is NULL → not found.</li><li>If key == root→data → found.</li><li>If key &lt; root→data → search left, else search right.</li></ol></div>
<pre class="code">struct Node *search(struct Node *r, int key) {
    while (r) {
        if (key == r-&gt;data) return r;
        r = (key &lt; r-&gt;data) ? r-&gt;left : r-&gt;right;
    }
    return NULL;
}</pre>
<p>Time = O(h). Balanced ≈ O(log n). Skewed = O(n).</p></div>
<div class="section"><h3>5.2 Insert</h3><p>A new key always becomes a <b>leaf</b>. Same walk as search; when you hit NULL, hang the new node there.</p><div class="fn"><b>Algorithm insert(root, key)</b><ol class="algo"><li>If root is NULL → createNode(key) and return it.</li><li>If key &lt; root→data → root→left = insert(left, key).</li><li>Else if key &gt; root→data → root→right = insert(right, key).</li><li>Return root.</li></ol></div></div>
<div class="section"><h3>5.3 Delete — three cases</h3><table class="table"><tr><th>Case</th><th>Node has</th><th>Action</th></tr><tr><td>1 Leaf</td><td>0 children</td><td>Set the parent's pointer to NULL and free the node.</td></tr><tr><td>2 One child</td><td>1 child</td><td>Bypass: parent points to that child. Free the node.</td></tr><tr><td>3 Two children</td><td>2 children</td><td>Find <b>in-order successor</b> (minimum of the right subtree), copy its value into the node, then delete the successor (now a leaf or one-child case).</td></tr></table>
<div class="fn"><b>in-order successor of a node with a right child</b> = keep going left from the right child until left is NULL.</div></div>
<div class="section"><h3>5.4 Min / Max</h3><p>Minimum = keep going left. Maximum = keep going right.</p></div>
<div class="section"><h3>Complexity</h3><table class="table"><tr><th>Shape</th><th>Search / Insert / Delete</th></tr><tr><td>Balanced</td><td>O(log n)</td></tr><tr><td>Skewed (sorted inserts)</td><td>O(n) — a stick</td></tr></table><div class="exam">After drawing any BST, read its in-order. If it is not sorted, the drawing is wrong.</div></div>`,
visualization:`<div class="section"><h3>Build 50, 30, 70, 20, 40, 60, 80</h3><div class="diagram">              50
           /      \\
         30        70
        /  \\      /  \\
      20    40  60    80</div>
<div class="trace">In-order 20 30 40 50 60 70 80 — sorted, so the tree is correct.</div></div>
<div class="section"><h3>Search 60 and search 25</h3><div class="trace">60: 50 → 70 → 60 FOUND (3 comparisons). 25: 50 → 30 → 20 → NULL NOT FOUND.</div></div>
<div class="section"><h3>Insert 65</h3><div class="trace">65 &gt; 50 → 70, 65 &lt; 70 → 60, 65 &gt; 60 → empty right of 60. New leaf 65.</div><div class="diagram">              50

                  \\
                   65</div></div>
<div class="section"><h3>Delete cases on the same tree</h3><div class="grid3"><div class="card"><b>Case 1 — leaf 20</b><div class="diagram">30 loses its left child.
20 is freed.</div></div><div class="card"><b>Case 2 — 70 if it had only 80</b><p>Parent 50→right becomes 80. The one child rises.</p></div><div class="card"><b>Case 3 — delete 50</b><p>Successor = min of right = <b>60</b>. Copy 60 into the 50-box, then delete the old 60 (leaf or one-child).</p></div></div>

<div class="trace">In-order now 20 30 40 60 70 80 — still sorted.</div></div>
<div class="section"><h3>Skewed trap</h3><div class="diagram">Insert 10,20,30,40,50 already sorted:
10
  \\
   20
     \\
      30 ...   height = n−1, every search is O(n).
That is why AVL exists.</div></div>`,
program:`<div class="section"><h3>Complete C Program: BST Insert, Delete, Search</h3><pre class="code">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

struct Node{ int data; struct Node *left,*right; };
struct Node *newNode(int x){ struct Node *n=(struct Node*)malloc(sizeof(struct Node)); n-&gt;data=x; n-&gt;left=n-&gt;right=NULL; return n; }

struct Node *insert(struct Node *r,int x){
    if(!r) return newNode(x);
    if(x&lt;r-&gt;data) r-&gt;left=insert(r-&gt;left,x);
    else if(x&gt;r-&gt;data) r-&gt;right=insert(r-&gt;right,x);
    return r;
}

struct Node *minNode(struct Node *r){ while(r &amp;&amp; r-&gt;left) r=r-&gt;left; return r; }

struct Node *deleteKey(struct Node *r,int x){
    if(!r) return NULL;
    if(x&lt;r-&gt;data) r-&gt;left=deleteKey(r-&gt;left,x);
    else if(x&gt;r-&gt;data) r-&gt;right=deleteKey(r-&gt;right,x);
    else{
        if(!r-&gt;left){ struct Node *t=r-&gt;right; free(r); return t; }
        if(!r-&gt;right){ struct Node *t=r-&gt;left; free(r); return t; }
        struct Node *s=minNode(r-&gt;right);
        r-&gt;data=s-&gt;data;
        r-&gt;right=deleteKey(r-&gt;right,s-&gt;data);
    }
    return r;
}

struct Node *search(struct Node *r,int x){
    while(r){ if(x==r-&gt;data) return r; r=(x&lt;r-&gt;data)?r-&gt;left:r-&gt;right; }
    return NULL;
}

void inorder(struct Node *r){ if(r){ inorder(r-&gt;left); printf("%d ",r-&gt;data); inorder(r-&gt;right); } }

int main(void){
    struct Node *root=NULL; int ch,x;
    do{
        printf("\\n1.Insert 2.Delete 3.Search 4.Inorder 0.Exit: "); scanf("%d",&amp;ch);
        if(ch==1){ scanf("%d",&amp;x); root=insert(root,x); }
        else if(ch==2){ scanf("%d",&amp;x); root=deleteKey(root,x); }
        else if(ch==3){ scanf("%d",&amp;x); printf(search(root,x)?"Found\\n":"Not Found\\n"); }
        else if(ch==4){ inorder(root); printf("\\n"); }
    }while(ch!=0);
    return 0;
}</pre></div>`},

'multiway':{
theory:`<div class="section"><h3>6.1 Definition</h3><p>A <b>Multiway (m-way) tree</b> allows a node to have more than two children. In an <b>m-way search tree</b> the children are ordered: keys inside a node are sorted and they act as separators for the child ranges.</p><div class="law">Order m ⇒ at most <b>m children</b> and at most <b>m − 1 keys</b>. A node with r keys always has r+1 children.</div></div>
<div class="section"><h3>6.2 How search works inside one fat node</h3><p>Keys K1 &lt; K2 &lt; … &lt; Kr split the number line into r+1 ranges:</p><div class="flow">child[0] holds keys &lt; K1 · child[i] holds Ki &lt; key &lt; K(i+1) · child[r] holds keys &gt; Kr</div><p>Search 35 in a node [20 | 50]: 35 &gt; 20 and 35 &lt; 50 → take the middle child.</p></div>
<div class="section"><h3>6.3 Why not stay with binary trees?</h3><p>A binary node throws away half the keys per comparison but each hop can be a <b>disk read</b>. A fat node throws away a much larger fraction per hop, so height drops from ~20 to ~3 for a million keys. B-Tree (next point) adds the balance rules on top of this idea.</p><table class="table"><tr><th></th><th>Binary search tree</th><th>m-way search tree</th></tr><tr><td>Children</td><td>2</td><td>up to m</td></tr><tr><td>Keys / node</td><td>1</td><td>up to m−1</td></tr><tr><td>Height</td><td>~log₂ n</td><td>~log<sub>m</sub> n</td></tr></table></div>
<div class="section"><h3>6.4 Node structure</h3><pre class="code">#define M 4
struct MNode {
    int keyCount;
    int keys[M-1];          /* sorted */
    struct MNode *child[M]; /* child[i] sits in gap i */
};</pre></div>`,
visualization:`<div class="section"><h3>Multiway Node Example</h3><div class="diagram">                [ 20 | 40 ]
              /     |      \\
         keys&lt;20  20..40  keys&gt;40
          [5,10]  [25,30] [50,60]</div><div class="trace">Search 30: compare with 20 and 40 → choose middle child → find 30.</div></div>`,
program:`<div class="section"><h3>C Representation of an Order-4 Multiway Node</h3><pre class="code">#include &lt;stdio.h&gt;
#define M 4

struct MNode {
    int keyCount;
    int keys[M-1];
    struct MNode *child[M];
};

int main(void){
    struct MNode root = {0};
    root.keyCount = 2;
    root.keys[0] = 20;
    root.keys[1] = 40;
    printf("Keys in root: %d %d\\n", root.keys[0], root.keys[1]);
    return 0;
}</pre></div>`},

'btree':{
theory:`<div class="section"><h3>7.1 B-Tree of order m — definition</h3><p>A <b>B-Tree</b> is a height-balanced multiway search tree with extra rules so it stays shallow and even.</p><ol class="algo"><li>A node has at most <b>m children</b> and at most <b>m − 1 keys</b>.</li><li>Except root and leaves, at least ceil(m/2) children (so at least ceil(m/2) − 1 keys).</li><li>Root has at least 2 children if it is not a leaf.</li><li><b>All leaves sit on the same level.</b></li><li>Keys inside a node are sorted. A node with k keys has k+1 children.</li></ol><div class="law">Height grows <b>only</b> when the root splits. Height shrinks <b>only</b> when the root becomes empty. That is why all leaves stay on one level.</div><p>Why: one node = one disk page. A million keys in a binary tree ≈ 20 jumps. In a fat B-Tree ≈ 3 or 4 jumps.</p></div>
<div class="section"><h3>7.2 Search</h3><div class="fn"><b>Algorithm btree_search(n, key)</b><ol class="algo"><li>i = 0. While i &lt; nkeys and key &gt; keys[i], i++.</li><li>If keys[i] == key → found.</li><li>If n is a leaf → not found.</li><li>Else n = child[i], repeat.</li></ol></div>
<pre class="code">struct BNode *btree_search(struct BNode *n, int key) {
    int i;
    while (n != NULL) {
        i = 0;
        while (i &lt; n-&gt;n &amp;&amp; key &gt; n-&gt;keys[i]) i++;
        if (i &lt; n-&gt;n &amp;&amp; n-&gt;keys[i] == key) return n;
        if (n-&gt;leaf) return NULL;
        n = n-&gt;child[i];
    }
    return NULL;
}</pre>
<div class="note">A node with keys [10, 20] has <b>three</b> children, not two. Do not write “compare with the middle and go left or right”.</div></div>
<div class="section"><h3>7.3 Insert — walk to a leaf, split at the median</h3><div class="fn"><b>Algorithm insert</b><ol class="algo"><li>Descend to the leaf whose range contains the key.</li><li>Insert the key in sorted order.</li><li>If the node now has more than m−1 keys: <b>split at the median</b>. Left stay, right stay, median goes <b>up</b>.</li><li>If the parent overflows, split it too.</li><li>If the <b>root</b> splits → new root holding only the median. Height + 1.</li></ol></div></div>
<div class="section"><h3>7.4 Delete — borrow, then merge</h3><p>Underflow = a non-root node has fewer than ⌈m/2⌉ − 1 keys. For order 3, minimum keys in a non-root = 1.</p><table class="table"><tr><th>Case</th><th>Action</th></tr><tr><td>Key in a leaf with a spare</td><td>Just delete it.</td></tr><tr><td>Key in an internal node</td><td>Replace with predecessor or successor, then delete that leaf key.</td></tr><tr><td>Leaf underflows, sibling has a spare</td><td><b>Borrow</b>: parent separator comes down, sibling’s nearest key goes up. Never move sibling→hungry directly.</td></tr><tr><td>No sibling can spare</td><td><b>Merge</b> hungry + parent separator + sibling. Re-check the parent. If the root empties, drop it (height − 1).</td></tr></table><div class="exam">Always try borrow before merge. The root may have 1 key — do not call that underflow.</div></div>
<div class="section"><h3>B-Tree vs B+ Tree</h3><table class="table"><tr><th></th><th>B-Tree</th><th>B+</th></tr><tr><td>Records live</td><td>In any node</td><td>Only in leaves</td></tr><tr><td>Leaves</td><td>Not linked</td><td>Linked left→right</td></tr><tr><td>Range query</td><td>In-order walk</td><td>Find start leaf, then follow next</td></tr></table></div>`,
visualization:`<div class="section"><h3>Full dry run — order 3, insert 10, 20, 5, 6, 12, 30, 7, 17</h3><p>Order 3 ⇒ max 2 keys. A 3rd key overflows. Split at the median.</p>
<table class="table"><tr><th>Insert</th><th>What happens</th></tr><tr><td>10</td><td>[10]</td></tr><tr><td>20</td><td>[10 20]</td></tr><tr><td>5</td><td>would be [5 10 20] → overflow. Median <b>10</b> up. Root [10], children [5] and [20].</td></tr><tr><td>6</td><td>6 &lt; 10 → [5] becomes [5 6]</td></tr><tr><td>12</td><td>12 &gt; 10 → [20] becomes [12 20]</td></tr><tr><td>30</td><td>[12 20 30] overflow. Median <b>20</b> up. Root [10 20], children [5 6], [12], [30]</td></tr><tr><td>7</td><td>[5 6 7] overflow. Median <b>6</b> up → root [6 10 20] also overflows. Median <b>10</b> becomes a <b>new root</b>. Height + 1.</td></tr><tr><td>17</td><td>between 10 and 20 → leaf [12] becomes [12 17]</td></tr></table>
<div class="diagram">              [ 10 ]
            /        \\
        [ 6 ]        [ 20 ]
       /    \\        /     \\
    [5]     [7]  [12 17]   [30]</div>
<div class="trace">All leaves on one level. Every node has ≤ 2 keys. Search 17: root 10 → go right to 20 → go left → [12 17] FOUND.</div></div>
<div class="section"><h3>Delete sketch (order 3)</h3><div class="trace">Start from [10|20] with leaves [5 6], [12], [30]. Delete 6 → leaf has a spare → [5]. Delete 12 → empty leaf, no sibling spare → merge with 10 → root [20], children [5 10] and [30].</div></div>`,
program:`<div class="section"><h3>C Program: B-Tree Search Skeleton and Node Representation</h3><pre class="code">#include &lt;stdio.h&gt;
#define MAX_KEYS 3

struct BNode {
    int n;
    int keys[MAX_KEYS];
    struct BNode *child[MAX_KEYS+1];
    int leaf;
};

struct BNode *btreeSearch(struct BNode *x, int key){
    int i=0;
    while(i&lt;x-&gt;n &amp;&amp; key&gt;x-&gt;keys[i]) i++;
    if(i&lt;x-&gt;n &amp;&amp; key==x-&gt;keys[i]) return x;
    if(x-&gt;leaf) return NULL;
    return btreeSearch(x-&gt;child[i], key);
}

int main(void){
    struct BNode root = {0};
    root.leaf = 1;
    root.n = 2;
    root.keys[0] = 10;
    root.keys[1] = 20;
    printf(btreeSearch(&amp;root,20) ? "Found\\n" : "Not Found\\n");
    return 0;
}

/* Insertion concept:
   1. Descend to correct leaf.
   2. Insert key in sorted position.
   3. If node overflows, split it.
   4. Promote median key to parent.
*/</pre><div class="note">For this syllabus point, focus first on B-Tree structure, properties, search path and split concept.</div></div>`},

'avl':{
theory:`<div class="section"><h3>8.1 AVL definition</h3><p>An <b>AVL tree</b> is a BST that refuses to become a stick: for every node, |height(left) − height(right)| ≤ 1.</p><div class="law">BF(node) = height(left) − height(right), with height(NULL) = −1 (or 0 if you count nodes — stay consistent). Legal values: <b>−1, 0, +1</b>. +2 or −2 ⇒ rotate.</div></div>
<div class="section"><h3>8.2 Why AVL?</h3><p>Inserting 10, 20, 30, 40 into a plain BST makes a right stick of height 3. An AVL rotates after 10,20,30 and stays height 2. Search / insert / delete stay <b>O(log n)</b> even in the worst case.</p><table class="table"><tr><th></th><th>BST</th><th>AVL</th></tr><tr><td>Search</td><td>O(h), h can be n</td><td>O(log n) always</td></tr><tr><td>Insert rotations</td><td>—</td><td>at most 1 (single or double)</td></tr><tr><td>Delete rotations</td><td>—</td><td>up to O(log n)</td></tr></table></div>
<div class="section"><h3>8.3 Height and BF functions</h3>
<pre class="code">int height(struct Node *n) {          /* leaf = 1 if empty = 0, OR empty = -1 */
    if (n == NULL) return 0;
    int hl = height(n-&gt;left), hr = height(n-&gt;right);
    return 1 + (hl &gt; hr ? hl : hr);
}

program:`<div class="section"><h3>Complete AVL insert — all four cases</h3><pre class="code">struct Node *insert(struct Node *node, int key) {
    if (node == NULL) return newNode(key);
    if (key &lt; node-&gt;data) node-&gt;left  = insert(node-&gt;left, key);
    else if (key &gt; node-&gt;data) node-&gt;right = insert(node-&gt;right, key);
    else return node;

    node-&gt;height = 1 + max(height(node-&gt;left), height(node-&gt;right));
    int b = getBalance(node);

    if (b &gt; 1 &amp;&amp; key &lt; node-&gt;left-&gt;data)              /* LL */
        return rotateRight(node);
    if (b &lt; -1 &amp;&amp; key &gt; node-&gt;right-&gt;data)            /* RR */
        return rotateLeft(node);
    if (b &gt; 1 &amp;&amp; key &gt; node-&gt;left-&gt;data) {            /* LR */
        node-&gt;left = rotateLeft(node-&gt;left);
        return rotateRight(node);
    }
    if (b &lt; -1 &amp;&amp; key &lt; node-&gt;right-&gt;data) {          /* RL */
        node-&gt;right = rotateRight(node-&gt;right);
        return rotateLeft(node);
    }
    return node;
}

        scanf("%d", &amp;x);
        root = insert(root, x);
    }
    printf("Inorder (must be sorted): ");
    inorder(root);
    return 0;
}</pre>

function parseSpec(str){
  if(!str) return null;
  str=String(str).replace(/\s+/g,'');
  let i=0;
  function name(){ let n=''; while(i<str.length && /[^(),]/.test(str[i])) n+=str[i++]; return n; }
  function node(){
    const val=name(); if(!val) return null;
    const o={val,left:null,right:null};
    if(str[i]==='('){ i++; if(str[i]!==','&&str[i]!==')') o.left=node(); if(str[i]===',') i++; if(str[i]!==')') o.right=node(); if(str[i]===')') i++; }
    return o;
  }
  return node();
}
function layoutTree(root){
  const nodes=[], edges=[]; let x=0;
  function walk(n,d){ if(!n) return; walk(n.left,d+1); n.x=x++; n.y=d; nodes.push(n); walk(n.right,d+1); if(n.left) edges.push([n,n.left]); if(n.right) edges.push([n,n.right]); }
  walk(root,0); return {nodes,edges};
}
function drawTree(spec, opt){
  const root=parseSpec(spec); if(!root) return '';
  const {nodes,edges}=layoutTree(root);
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs), maxY=Math.max.apply(null,ys);
  const W=Math.max(320,(maxX-minX+1)*74), H=(maxY+1)*78+28;
  const cx=n=> ((n.x-minX)/(maxX-minX||1))*(W-80)+40;
  const cy=n=> n.y*78+36;
  let lines=edges.map(([a,b])=>'<line x1="'+cx(a)+'" y1="'+cy(a)+'" x2="'+cx(b)+'" y2="'+cy(b)+'" stroke="#94a3b8" stroke-width="2"/>').join('');
  let gs=nodes.map((n,i)=>{
    const on=opt&&opt.hi&&opt.hi.indexOf(n.val)>=0;
    const tag=opt&&opt.tags&&opt.tags[n.val]?opt.tags[n.val]:'';
    return '<g class="tn" style="animation-delay:'+(i*90)+'ms"><circle cx="'+cx(n)+'" cy="'+cy(n)+'" r="18" fill="'+(on?'#f4c14a':'#fff')+'" stroke="'+(on?'#d4a017':'#475569')+'" stroke-width="2"/><text x="'+cx(n)+'" y="'+(cy(n)+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">'+n.val+'</text>'+(tag?'<text x="'+cx(n)+'" y="'+(cy(n)+32)+'" text-anchor="middle" font-size="11" fill="#1d4ed8">'+tag+'</text>':'')+'</g>';
  }).join('');
  return '<div class="live-tree"><svg viewBox="0 0 '+W+' '+H+'" role="img">'+lines+gs+'</svg></div>';
}

function highlightC(raw){

    chunk=chunk.replace(/"(?:\\.|[^"\\])*"/g,m=>'<span class="c-str">'+m+'</span>');

<div class="section"><h3>Step 2 — Exam definition of a tree</h3>
<p>A <b>Tree</b> is a <b>non-linear, hierarchical</b> data structure made of <b>nodes</b> connected by <b>edges</b>, such that there is <b>exactly one path</b> between any two nodes. It starts from a special node called the <b>root</b> and has <b>no cycles</b>.</p>
<div class="law">n nodes ⇒ exactly <b>n − 1</b> edges. Every node except the root has exactly one parent, so it brings exactly one edge.</div>
<p>Think of a family tree or a company chart: one person at the top, children below, nobody has two bosses, nobody is their own grand-boss. In CS we draw the tree <b>upside down</b>: root at the top, leaves at the bottom.</p>
<ol class="algo">
<li><b>Non-linear:</b> not one straight line like an array or a linked list.</li>
<li><b>Hierarchical:</b> parent → child (one-to-many).</li>
<li><b>One root.</b> Every other node has exactly one parent.</li>
<li><b>No cycles.</b> You can never walk in a loop.</li>
<li><b>Exactly one path</b> between any two nodes. Two paths ⇒ graph, not a tree.</li>
</ol>

<tr><td>A</td><td>—</td><td>B, C</td><td>0</td><td>3</td><td>2</td><td>no</td></tr>
<tr><td>B</td><td>A</td><td>D, E</td><td>1</td><td>2</td><td>2</td><td>no</td></tr>
<tr><td>C</td><td>A</td><td>F</td><td>1</td><td>1</td><td>1</td><td>no</td></tr>
<tr><td>D</td><td>B</td><td>—</td><td>2</td><td>0</td><td>0</td><td>yes</td></tr>
<tr><td>E</td><td>B</td><td>G</td><td>2</td><td>1</td><td>1</td><td>no</td></tr>
<tr><td>F</td><td>C</td><td>—</td><td>2</td><td>0</td><td>0</td><td>yes</td></tr>
<tr><td>G</td><td>E</td><td>—</td><td>3</td><td>0</td><td>0</td><td>yes</td></tr>
</table>
<div class="exam">A is NOT the parent of D. A is the grandparent. Parent means the node immediately above.</div></div>

<div class="section"><h3>Step 4 — Linear vs non-linear</h3>
<div class="grid2">
<div class="card"><b>Linear: array / linked list</b>
<div class="diagram">10 → 20 → 30 → 40</div>
<p>Every element has one next. To reach 40 you must pass 10, 20, 30.</p></div>
<div class="card"><b>Non-linear: tree</b>
<div class="diagram">        10
       /  \\
     20    30
    /
  40</div>
<p>One element can have many next (children). 10 has two children.</p></div>
</div>
<div class="law">Linear = one sequence. Tree = a hierarchy. Graph = a general network (cycles allowed).</div></div>

<div class="section"><h3>Step 5 — Is this a tree?</h3>
<table class="table"><tr><th>Picture</th><th>Tree?</th><th>Reason</th></tr>
<tr><td>A→B, A→C, B→D</td><td><b>Yes</b></td><td>One root, one parent each, no loop, 4 nodes 3 edges</td></tr>
<tr><td>A→B, A→C, B→D, C→D</td><td><b>No</b></td><td>D has two parents — this is a graph. Two paths from A to D</td></tr>
<tr><td>A→B→C→A</td><td><b>No</b></td><td>Cycle. Trees never loop</td></tr>
<tr><td>A→B and a separate C→D</td><td><b>No</b> (it is a <b>forest</b>)</td><td>Two roots, not joined</td></tr>
</table>
<div class="grid2">
<div class="card"><b>YES — a tree</b>
<div class="diagram">    A
   / \\
  B   C
 /
D</div></div>
<div class="card"><b>NO — two parents</b>
<div class="diagram">    A
   / \\
  B   C
   \\ /
    D</div></div>
<div class="card"><b>NO — a cycle</b>
<div class="diagram">A → B → C → A</div></div>
<div class="card"><b>NO — a forest</b>
<div class="diagram">A → B     C → D</div></div>
</div>
<div class="exam">If they ask “difference between tree and graph”: tree = no cycle, one root, n−1 edges, exactly one path. Graph = cycles allowed, any number of edges.</div></div>

<div class="section"><h3>Step 6 — Tree vs graph vs forest</h3>
<table class="table"><tr><th>Property</th><th>Tree</th><th>Graph</th><th>Forest</th></tr>
<tr><td>Roots</td><td>Exactly one</td><td>None required</td><td>One or more</td></tr>
<tr><td>Cycles</td><td>Never</td><td>Allowed</td><td>Never (each piece is a tree)</td></tr>
<tr><td>Edges</td><td>Exactly n − 1</td><td>Any number</td><td>n − k if there are k trees</td></tr>
<tr><td>Path between two nodes</td><td>Exactly one</td><td>Zero or more</td><td>One if same tree, none if different trees</td></tr>
<tr><td>Parents</td><td>Every non-root has exactly one</td><td>A node may have many</td><td>Same as a tree, per piece</td></tr>
</table>
<div class="law">Two parents or a loop ⇒ graph. Two roots and no shared nodes ⇒ forest. A forest of 1 tree is just a tree.</div></div>

<div class="section no-auto-tree"><h3>Step 7 — Empty tree</h3>
<p>Zero nodes. In code: <code>root = NULL</code>. This is still a valid tree. Many recursive functions stop here.</p>
<div class="fn"><b>Convention</b>
<ol class="algo">
<li>Empty tree has 0 nodes and 0 edges.</li>
<li>Height of NULL = <b>−1</b> if you count edges (leaf height = 0).</li>
<li>If your book counts nodes (leaf height = 1), height of empty = 0. Write which one you use.</li>
</ol></div>
<div class="exam">Do not say “NULL is not a tree”. The empty tree is the base case of the recursive definition.</div></div>

<div class="section"><h3>Step 8 — Recursive idea: every node is a tree</h3>
<div class="law">A tree = a root + a list of subtrees. Every child starts a smaller tree. That is why tree algorithms are almost always recursive.</div>
<p>On the sample: subtree of B = {B, D, E, G}. Subtree of C = {C, F}. Subtree of D = {D} only.</p>
<div class="diagram">Whole tree rooted at A

Subtree of B:        Subtree of C:
      B                    C
     / \\                    \\
    D   E                    F
         \\
          G</div>
<div class="exam">A general tree allows any number of children. A binary tree later adds the rule “at most two named sides: left and right”.</div></div>

<div class="section"><h3>Step 9 — Tree ADT (what you can do)</h3>
<p>ADT means the operations, not the drawing. For a general tree the usual set is:</p>
<table class="table"><tr><th>Operation</th><th>Meaning</th></tr>
<tr><td>create / empty</td><td>root = NULL</td></tr>
<tr><td>isEmpty</td><td>root is NULL?</td></tr>
<tr><td>insert child</td><td>hang a new node under a given parent</td></tr>
<tr><td>delete</td><td>usually a leaf, or a whole subtree</td></tr>
<tr><td>search</td><td>walk nodes until the key is found (no order yet, so O(n))</td></tr>
<tr><td>traverse</td><td>visit every node once (pre / post / level). General trees have no natural in-order</td></tr>
</table>
<div class="note">BST insert/delete rules are not basics. They need a key-order law. That is the BST tab.</div></div>

<div class="section"><h3>Step 10 — Why trees exist</h3>
<p>Two reasons only:</p>
<ol class="algo">
<li><b>The data is a hierarchy.</b> Folder inside folder, tag inside tag, manager above employee.</li>
<li><b>Speed.</b> A balanced tree of 1,000,000 keys needs about 20 comparisons (log₂ n), not 1,000,000.</li>
</ol>
<table class="table"><tr><th>n keys</th><th>Linked list (worst)</th><th>Balanced tree ≈ log₂ n</th></tr>
<tr><td>1,000</td><td>1,000 steps</td><td>10 steps</td></tr>
<tr><td>1,000,000</td><td>1,000,000 steps</td><td>20 steps</td></tr>
<tr><td>1,000,000,000</td><td>1,000,000,000 steps</td><td>30 steps</td></tr>
</table>
<div class="law">Each level of a balanced tree throws away about half the keys. That is why BST, AVL and B-Tree exist — they are taught in later tabs.</div></div>

<div class="section"><h3>Step 11 — Applications of trees (4-mark list)</h3>
<table class="table"><tr><th>Use</th><th>Why a tree</th></tr>
<tr><td>File system / folders</td><td>One parent folder, no cycle</td></tr>
<tr><td>HTML / XML DOM</td><td>Tags nest; &lt;html&gt; is the root</td></tr>
<tr><td>Expression / compiler</td><td>Operators inside, operands at leaves. Full picture in Binary tab</td></tr>
<tr><td>Database index</td><td>B-Tree / B+ Tree — later tab</td></tr>
<tr><td>Huffman coding</td><td>Extended binary tree of codes</td></tr>
<tr><td>Decision / game tree</td><td>Each choice opens child positions</td></tr>
<tr><td>Routing / org chart</td><td>Hierarchy, one boss</td></tr>
</table>
<div class="grid2">
<div class="card"><b>Folders</b>
<div class="diagram">        C:
       /  \\

  DS   OS</div>
<p>Every folder has one parent. You cannot put a folder inside itself.</p></div>

</div>
<div class="exam">Write 5–6 bullets with one line each. That is a standard 4-mark question.</div></div>

<div class="section"><h3>Step 16 — Node, edge, degree, weight</h3>
<table class="table"><tr><th>Term</th><th>Meaning</th><th>On A–G</th></tr>
<tr><td>Edge / branch</td><td>Parent–child link</td><td>6 edges. Law: n − 1</td></tr>

<div class="section"><h3>Step 17 — Level, depth, height, path</h3>
<table class="table"><tr><th>Term</th><th>Meaning</th><th>On A–G</th></tr>
<tr><td>Level</td><td>Edges from the root. Root = 0. Child = parent + 1</td><td>A=0, B=C=1, D=E=F=2, G=3</td></tr>
<tr><td>Depth</td><td>Edges from the root down to that node. Same number as level when root = 0</td><td>depth(G)=3 via A→B→E→G</td></tr>
<tr><td>Height of a node</td><td>Longest downward path in edges. Leaf = 0. height(NULL)= −1</td><td>height(B)=2, height(E)=1, height(D)=0</td></tr>
<tr><td>Height of the tree</td><td>Height of the root = max level</td><td>3</td></tr>
<tr><td>Path</td><td>The only simple route. Length = number of edges</td><td>A→B→E→G length 3. You cannot go via C to reach G</td></tr>
</table>
<div class="fn"><b>Formulas</b>
<ol class="algo">
<li>level(root) = 0, level(child) = level(parent) + 1.</li>
<li>height(n) = 1 + max(height of children). height(leaf) = 0.</li>
<li>height(tree) = height(root).</li>
</ol></div>
<div class="exam">Depth is from the root down. Height is from the node down to a leaf. Do not swap them.</div></div>

<div class="section"><h3>Step 22 — Common mistakes</h3>
<ol class="algo">
<li>Calling A the parent of D. A is the <b>grandparent</b> / ancestor.</li>
<li>Mixing degree of a node with degree of the tree.</li>
<li>Switching level 0 and level 1 in the same answer. Stay consistent.</li>
<li>Swapping height and depth. Depth = from root down. Height = from the node down to a leaf.</li>
<li>Saying E and F are siblings. Different parents (B and C).</li>
<li>Saying two separate trees are “not a tree so they are a graph”. They are a <b>forest</b>.</li>
<li>Saying the empty tree is invalid. root = NULL is valid.</li>
<li>Dumping binary-tree types (full / complete / AVL) in a “define a tree” answer. Those belong to later tabs.</li>
</ol></div>

<div class="section"><h3>Step 23 — How a general tree is stored (LCRS)</h3>
<p>A general-tree node may have many children. To store it with only two pointers: <b>left = first child</b>, <b>right = next sibling</b>. This is <b>left-child right-sibling (LCRS)</b> or natural correspondence.</p>
<div class="diagram">General: A has children B, C, D. B has E, F. D has G.

        A
     /  |  \\
    B   C   D
   / \\      |
  E   F     G

LCRS binary: left = first child, right = next brother/sister.

        A
       /
      B
     / \\
    E   C
     \\   \\
      F   D
         /
        G</div>
<ol class="algo">
<li>Keep the root.</li>
<li>First child becomes the left child.</li>
<li>The remaining children hang as a right chain under that first child.</li>
</ol>
<div class="exam">Pre-order of the general tree = pre-order of the LCRS binary tree. Post-order of the general tree = in-order of the LCRS binary tree. A general tree has no natural in-order.</div></div>

<div class="section"><h3>Step 24 — Forest stored as one binary tree</h3>
<p>Convert each tree with LCRS, then join the roots as a right-sibling chain: root(T1)→right = root(T2).</p>
<div class="diagram">Forest after deleting A:

   B          C
  / \\         |
 D   E        F
      \\
       G

Join B→right = C. That is one binary tree.</div>
<div class="exam">Exam line: forest = many trees. Binary form = first root as the binary root, remaining roots hanging to the right.</div></div>

<div class="section"><h3>Step 25 — createNode in C</h3>
<p>This is the smallest program for basics: make one node. Left and right start as NULL. That one node is a one-node tree. The empty tree is just root = NULL.</p>
<div class="fn"><b>Algorithm createNode(value)</b>
<ol class="algo">
<li>Allocate memory for one node.</li>
<li>Store value in data.</li>
<li>Set left = NULL and right = NULL.</li>
<li>Return the pointer.</li>
</ol></div>
<pre class="code">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

struct Node {
    int data;
    struct Node *left;
    struct Node *right;
};

struct Node *createNode(int value) {
    struct Node *n = (struct Node*)malloc(sizeof(struct Node));
    n-&gt;data = value;
    n-&gt;left = n-&gt;right = NULL;
    return n;
}

int main(void) {
    int x;
    struct Node *root;
    printf("Enter one value: ");
    scanf("%d", &amp;x);
    root = createNode(x);
    printf("Node %d created. left = NULL, right = NULL.\\n", root-&gt;data);
    return 0;
}</pre>
<div class="io">Enter one value: 10
Node 10 created. left = NULL, right = NULL.</div></div>

<div class="section"><h3>Step 26 — Basics finished. What is next?</h3>
<p>You can now define a tree, draw A–G, name every term, tell tree from graph from forest, list applications, and write createNode.</p>
<table class="table"><tr><th>Next tab</th><th>New rule it adds</th></tr>
<tr><td>Binary Tree</td><td>At most two named children: left and right. Traversal, linked/array, insert/delete/search with no key order</td></tr>
<tr><td>BST</td><td>Whole left subtree &lt; node &lt; whole right subtree</td></tr>
<tr><td>Multiway</td><td>A node may hold many keys and many children</td></tr>
<tr><td>B-Tree</td><td>Balanced multiway tree used on disk</td></tr>
<tr><td>AVL</td><td>BST that stays balanced with rotations</td></tr>
</table>
<div class="law">Press Next tab to start Binary Tree. Keep the A–G picture in your head — Binary tab uses it again for traversals.</div></div>`;
const TAB_INTRO={
binary:`<div class="section"><h3>Binary Tree — every concept in this tab</h3>
<div class="law">Empty, or root + left binary tree + right binary tree. At most two named children.</div>
<ol class="algo">
<li>Definition and left ≠ right.</li>
<li>Types: full, complete / almost complete, perfect, skewed, extended.</li>
<li>Formulas: max/min nodes, n₀ = n₂ + 1, n+1 NULLs, Catalan.</li>
<li>Traversals: NLR, LNR, LRN, level-order, iterative in-order, rebuild from two lists.</li>
<li>Linked [L|data|R] and array (2i, 2i+1).</li>
<li>Insert / delete / search with no key order (O(n)).</li>
<li>Expression tree, copy via pre-order, count/height functions.</li>
</ol></div>`,
bst:`<div class="section"><h3>BST — every concept in this tab</h3>
<div class="law">Whole left subtree &lt; node &lt; whole right subtree. In-order is sorted.</div>
<ol class="algo">
<li>Definition and the “not a BST” trap (local child OK, whole subtree wrong).</li>
<li>Search, insert (new key is always a leaf).</li>
<li>Min / max, predecessor, successor.</li>
<li>Delete: leaf, one child, two children (successor).</li>
<li>Duplicates: forbid, or always one fixed side.</li>
<li>Complexity: O(log n) balanced, O(n) skewed. AVL is the fix.</li>
</ol></div>`,
multiway:`<div class="section"><h3>Multiway Tree — every concept in this tab</h3>
<div class="law">Order m ⇒ ≤ m children and ≤ m − 1 keys. r keys ⇒ r+1 children.</div>
<ol class="algo">
<li>Definition of a general / m-way search tree.</li>
<li>Keys as separators, search inside a fat node.</li>
<li>Linked implementation: key array + child pointer array.</li>
<li>Why fat nodes beat BST on disk (height log_m n).</li>
<li>2-3 tree = order-3 multiway search tree (leads to B-Tree).</li>
</ol></div>`,
btree:`<div class="section"><h3>B-Tree — every concept in this tab</h3>
<div class="law">Balanced multiway search tree. All leaves on one level. Height grows only on a root split.</div>
<ol class="algo">
<li>Order m properties (max / min children and keys).</li>
<li>Search path through ranges, not “left or right” only.</li>
<li>Insert + median split. Root split increases height.</li>
<li>Delete: spare in leaf, borrow, merge.</li>
<li>B vs B+. Why databases use these on disk.</li>
<li>Full order-3 dry run (same example as before).</li>
</ol></div>`,
avl:`<div class="section"><h3>AVL Tree — every concept in this tab</h3>
<div class="law">BST + |BF| ≤ 1 at every node. BF = height(left) − height(right).</div>
<ol class="algo">
<li>Why AVL: sorted inserts make a BST stick.</li>
<li>Height and BF functions. Legal BF: −1, 0, +1.</li>
<li>Single rotation: LL (right), RR (left).</li>
<li>Double rotation: LR, RL.</li>
<li>Insert: at most one rotation. Delete: up to O(log n) rotations.</li>
<li>Worst height ≈ 1.44 log₂ n. Search always O(log n).</li>
</ol></div>`
};
const TAB_EXTRA={
binary:`<div class="section"><h3>More binary concepts: count, copy, threads, expression</h3>
<div class="fn"><b>Algorithm count(n)</b> — if n is NULL return 0, else 1 + count(left) + count(right).</div>
<div class="fn"><b>Algorithm height(n)</b> — if n is NULL return −1 (or 0), else 1 + max(height(left), height(right)).</div>
<div class="fn"><b>Copy a tree</b> — pre-order: create the node, then copy left, then copy right.</div>
<p><b>Threaded binary tree (advanced):</b> a linked binary tree has n+1 NULL pointers. A thread uses a NULL to point to the in-order predecessor or successor so in-order needs no stack. Mention this when asked “how to use the unused pointers”.</p>
<p><b>Expression tree:</b> operators inside, operands at leaves. In-order = infix, post-order = postfix, pre-order = prefix. Same A–G rebuild idea applies.</p>
<div class="exam">Heap is a complete binary tree stored in an array (2i, 2i+1). It is a shape rule, not a BST rule.</div></div>`,
bst:`<div class="section"><h3>More BST concepts: predecessor, duplicates, check</h3>
<p><b>In-order predecessor</b> of a node with a left child = maximum of the left subtree (keep going right). Successor = minimum of the right subtree.</p>
<p><b>Duplicates:</b> either reject equal keys, or always send equals to one fixed side. Say which in the exam.</p>
<div class="exam"><b>NOT a BST:</b> 30 with left 20 and right 40, and 40 has left 25. Locally 25&lt;40 looks fine, but 25 sits in the right of 30 while 25&lt;30. In-order 20 30 25 40 is not sorted.</div>
<p><b>Check BST:</b> do in-order. If the sequence is strictly increasing, it is a BST. Or check every node’s whole-subtree range [low, high].</p>
<p><b>Use:</b> sets, maps, symbol tables. If data arrives sorted, the BST becomes a stick — use AVL (next tabs).</p></div>`,
multiway:`<div class="section"><h3>More multiway concepts: 2-3 tree and formation</h3>
<p>A <b>2-3 tree</b> is an order-3 multiway search tree: a node is a 2-node (1 key, 2 children) or a 3-node (2 keys, 3 children). All leaves at one level if we also keep it balanced — that balanced version is a B-Tree of order 3.</p>
<div class="diagram">Formation of an order-4 node while inserting 10, 20, 40, 5:

[10] → [10 20] → [10 20 40]  (full: max 3 keys)
Insert 5 → overflow if we forced max 3. In a plain m-way tree the node may grow
until we add B-Tree min/max rules. Search 20 still: look inside the sorted keys.</div>
<p><b>Implementation:</b> one struct, two arrays — <code>keys[m-1]</code> and <code>child[m]</code>. Missing child = NULL. This is the linked form of a multiway node (the “linked list” idea is “node + pointers”, not a 1-D list).</p></div>`,
btree:`<div class="section"><h3>More B-Tree concepts: order table, disk, B*</h3>
<table class="table"><tr><th>Order m</th><th>Max keys</th><th>Min keys (non-root)</th><th>Max children</th><th>Min children (non-root)</th></tr>
<tr><td>3 (2-3 tree)</td><td>2</td><td>1</td><td>3</td><td>2</td></tr>
<tr><td>4 (2-3-4 tree)</td><td>3</td><td>1</td><td>4</td><td>2</td></tr>
<tr><td>5</td><td>4</td><td>2</td><td>5</td><td>3</td></tr>
</table>
<p><b>Why disk:</b> one node = one page. Binary height ~20 page faults for a million keys. B-Tree height ~3.</p>
<p><b>B* tree (advanced):</b> nodes stay at least 2/3 full, overflow prefers redistributing to a sibling before a split. Same search idea.</p>
<div class="exam">Do not say “B-Tree is a binary tree”. It is multiway. Do not search with only left/right — a node has many ranges.</div></div>`,
avl:`<div class="section"><h3>More AVL concepts: delete, height bound, vs others</h3>
<p><b>Delete:</b> BST delete first, then walk up. Unlike insert, several ancestors can go unbalanced, so up to O(log n) rotations.</p>
<p><b>Height bound:</b> worst AVL of height h has Fibonacci-many nodes. Height ≤ 1.44 log₂(n+2) − 0.33. Still O(log n).</p>
<table class="table"><tr><th></th><th>BST</th><th>AVL</th><th>B-Tree</th></tr>
<tr><td>Children</td><td>2</td><td>2</td><td>up to m</td></tr>
<tr><td>Balance</td><td>none</td><td>|BF|≤1</td><td>all leaves same level</td></tr>
<tr><td>Search</td><td>O(h), h can be n</td><td>O(log n)</td><td>O(log_m n) disk hops</td></tr>
<tr><td>Use</td><td>memory, small n</td><td>memory, guaranteed log n</td><td>databases, disk</td></tr>
</table></div>`
};
const TAB_END={};
function mixPoint(block){
  const T=sectionsOf(block.theory), V=sectionsOf(block.visualization), P=sectionsOf(block.program);
  const out=[], n=Math.max(T.length,V.length,P.length);
  for(let i=0;i<n;i++){ if(T[i]) out.push(T[i]); if(V[i]) out.push(V[i]); if(P[i]) out.push(P[i]); }
  return out;
}
function titleOf(el){ return ((el.querySelector('h3')||{}).textContent||''); }
function filterSections(els, keep, skip){
  return els.filter(function(el){
    const t=titleOf(el);
    if(skip && skip.some(function(s){ return t.indexOf(s)>=0; })) return false;
    if(keep) return keep.some(function(s){ return t.indexOf(s)>=0; });
    return true;
  });
}
function mixTab(tab){
  if(tab.id==='basics') return sectionsOf(TAB_BASICS);
  const out=[];
  if(TAB_INTRO[tab.id]) out.push.apply(out, sectionsOf(TAB_INTRO[tab.id]));
  (tab.keys||[]).forEach(function(k){
    out.push.apply(out, filterSections(mixPoint(data[k]||{}), tab.keep, tab.skip));
  });
  if(TAB_EXTRA[tab.id]) out.push.apply(out, sectionsOf(TAB_EXTRA[tab.id]));
  if(TAB_END[tab.id]) out.push.apply(out, sectionsOf(TAB_END[tab.id]));
  return out;
}
function enhanceCard(card, topicId){
  card.classList.add('card-step');
  card.querySelectorAll('pre.code, .code').forEach(pre=>{
    if(pre.dataset.hi) return;
    pre.dataset.hi='1';
    pre.innerHTML=highlightC(pre.textContent);
  });
  const io=card.querySelector('.io');
  const hasCode=card.querySelector('pre.code, .code');
  if(hasCode&&io){
    const row=document.createElement('div'); row.className='row-actions';
    const run=document.createElement('button'); run.type='button'; run.className='run-btn'; run.textContent='Run';
    const box=document.createElement('pre'); box.className='termbox'; box.hidden=true;
    run.onclick=()=>{ box.hidden=false; typewrite(box, io.textContent); };
    row.appendChild(run); card.appendChild(row); card.appendChild(box);
  }
  if(!card.classList.contains('no-auto-tree') && !card.querySelector('#termBoard, .tv-svg, .live-tree')){
    const title=(card.querySelector('h3')||{}).textContent||'';
    const hold=document.createElement('div');
    hold.innerHTML=drawTree(treeForTitle(title, topicId));
    const h=card.querySelector('h3');
    if(h&&h.nextSibling) card.insertBefore(hold.firstChild, h.nextSibling);
    else card.insertBefore(hold.firstChild, card.firstChild);
  }
}
let cards=[], stepI=0, playTimer=null;
function showStep(i){
  if(!cards.length) return;
  stepI=((i%cards.length)+cards.length)%cards.length;
  panel.innerHTML='';
  const clone=cards[stepI].cloneNode(true);
  enhanceCard(clone, currentTopic);
  panel.appendChild(clone);
  bindTermViz();
  const nav=document.createElement('div'); nav.className='nav-big';
  const prev=document.createElement('button'); prev.className='lbtn'; prev.textContent='Prev'; prev.onclick=()=>{stopPlay();showStep(stepI-1);};
  const next=document.createElement('button'); next.className='lbtn primary'; next.textContent=stepI===cards.length-1?'Next tab':'Next'; next.onclick=()=>{stopPlay(); if(stepI===cards.length-1) goNextPoint(); else showStep(stepI+1);};
  nav.appendChild(prev); nav.appendChild(next); panel.appendChild(nav);
  document.getElementById('lessonStat').textContent=(stepI+1)+' / '+cards.length;
  window.scrollTo({top:0,behavior:'smooth'});
}
function goNextPoint(){
  const idx=topics.findIndex(t=>t.id===currentTopic);
  const n=topics[(idx+1)%topics.length];
  currentTopic=n.id; location.hash=n.id; render();
}
function stopPlay(){ if(playTimer){clearInterval(playTimer);playTimer=null;} document.getElementById('lessonPlay').textContent='Play'; }
function playTeach(){
  if(playTimer){stopPlay();return;}
  document.getElementById('lessonPlay').textContent='Pause';
  playTimer=setInterval(()=>{ if(stepI>=cards.length-1){stopPlay();return;} showStep(stepI+1); },2600);
}
function bindTermViz(){
  const board=document.getElementById('termBoard');
  const chips=document.getElementById('termChips');
  const exam=document.getElementById('termExam');
  const cap=document.getElementById('termCap');
  if(!board||!chips) return;
  chips.innerHTML='';
  TERM_MODES.forEach(m=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=m.label; b.onclick=()=>apply(m.id); chips.appendChild(b);
  });
  function apply(id){
    const m=TERM_MODES.find(x=>x.id===id)||TERM_MODES[0];
    board.querySelectorAll('g[data-id]').forEach(g=>{
      const nid=g.getAttribute('data-id'); const on=m.hi.indexOf(nid)>=0;
      g.classList.toggle('on',on); g.classList.toggle('dim',!on);
      const tag=g.querySelector('text.tag'); if(tag) tag.textContent=m.tags[nid]||'';
    });
    [...chips.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('active',TERM_MODES[i].id===id));
    exam.textContent=m.exam; cap.textContent=m.cap;
  }
  board.querySelectorAll('g[data-id]').forEach((g,i)=>{ g.style.opacity='0'; setTimeout(()=>{g.style.transition='opacity .35s'; g.style.opacity='1';},80*i); });
  apply('root');
}
let currentTopic='basics';
const menu=document.getElementById('menu'); const panel=document.getElementById('panel');
function buildMenu(){ menu.innerHTML=''; topics.forEach(t=>{ const b=document.createElement('button'); b.dataset.id=t.id; b.innerHTML='<span class="num">'+t.no+'</span><span>'+t.label+'</span>'; b.onclick=()=>{currentTopic=t.id;location.hash=t.id;render();}; menu.appendChild(b); }); }
function render(){
  stopPlay();
  const t=topics.find(x=>x.id===currentTopic)||topics[0];
  document.getElementById('pointPill').textContent='TAB '+t.no;
  document.getElementById('topicTitle').textContent=t.title;
  document.getElementById('officialLine').innerHTML='<b>'+t.title+'.</b> '+t.official+'. Next walks one idea at a time. Same A–G sample tree for every Basics word.';
  [...menu.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.id===currentTopic));
  cards=mixTab(t);
  showStep(0);
}
document.getElementById('lessonPrev').onclick=()=>{stopPlay();showStep(stepI-1);};
document.getElementById('lessonNext').onclick=()=>{stopPlay(); if(stepI===cards.length-1) goNextPoint(); else showStep(stepI+1);};
document.getElementById('lessonPlay').onclick=playTeach;
buildMenu();
const HASH_MAP={definition:'basics',traversal:'binary',linked:'binary','binary-ops':'binary','bst-ops':'bst','single-rotation':'avl','double-rotation':'avl'};
const initial=location.hash.replace('#','');
currentTopic=HASH_MAP[initial]||(topics.some(x=>x.id===initial)?initial:'basics');
render();

</script>
